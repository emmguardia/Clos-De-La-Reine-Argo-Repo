<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/Images/Logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts : preconnect + link stylesheet déclenchent le téléchargement
         en parallèle du JS bundle (sinon l'@import dans index.css attend le CSS).
         Évite le FOUC ("Layout forced before page loaded"). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" />
    <title>Le Clos De La Reine — Colliers, harnais et laisses pour chiens</title>
    <meta name="description" content="Le Clos de la Reine : accessoires pour chiens en cuir végétal. Colliers, harnais et laisses de qualité, finitions sellier, production atelier française." />
    <meta name="keywords" content="collier chien, harnais chien, laisse chien, cuir végétal, accessoires chiens, Le Clos de la Reine" />
    <link rel="canonical" href="https://leclosdelareine.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leclosdelareine.com/" />
    <meta property="og:title" content="Le Clos De La Reine — Colliers, harnais et laisses pour chiens" />
    <meta property="og:description" content="Accessoires pour chiens en cuir végétal. Colliers, harnais et laisses de qualité, finitions sellier, production atelier française." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://leclosdelareine.com/Images/header.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Le Clos De La Reine — Colliers, harnais et laisses pour chiens" />
    <meta name="twitter:description" content="Accessoires pour chiens en cuir végétal. Colliers, harnais et laisses de qualité, finitions sellier." />
    <!-- Pas de preload d'image hero global : header.webp n'est utilisé que sur
         la home et provoque "preloaded but not used" sur toutes les autres pages.
         Le coût d'un fetch normal sur la home est négligeable (~100ms). -->
    <!-- Umami Analytics - Privacy-first, no cookies required -->
    <script defer src="https://analytics.zenixweb.fr/script.js" data-website-id="53018c31-1508-409b-99bd-04e8938a473c"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
