{{- /* SealedSecret pour Dev : secret chiffré, déploiement auto, plus de fallback JWT */}}
{{- /* Accès défensif : si le rendu se fait sans values-dev.yaml, .Values.sealedSecretDev
       est absent. Un `index` direct échouerait alors sur « index of nil pointer » et
       ferait planter tout le rendu du chart, au lieu d'ignorer simplement ce template. */}}
{{- $sealedDev := default dict (default dict .Values.sealedSecretDev).encryptedData }}
{{- if and (eq .Release.Namespace "clos-de-la-reine-dev") (hasKey $sealedDev "jwt-secret") }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: clos-secrets
  namespace: clos-de-la-reine-dev
spec:
  encryptedData:
    {{- toYaml $sealedDev | nindent 4 }}
{{- end }}
