server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # Security headers — applied to all responses from this server block.
    # Child location blocks that define their own add_header would override
    # these, so we avoid add_header in child blocks and use `expires` instead.
    # -----------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP — no 'unsafe-inline' in script-src.
    # style-src keeps 'unsafe-inline': React uses inline style= attributes and Stripe Elements
    # injects inline styles; CSS injection cannot execute code like JS injection can.
    # The Vite build has no inline scripts (modulePreload polyfill disabled in vite.config.ts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://analytics.zenixweb.fr; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.stripe.com https://api-adresse.data.gouv.fr https://analytics.zenixweb.fr; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json image/svg+xml;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://clos-de-la-reine-back.clos-de-la-reine.svc.cluster.local:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        # Remove duplicate security headers set by the Express backend
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # Static assets — use expires (not add_header) to preserve inherited security headers
    location /Images/ {
        alias /usr/share/nginx/html/Images/;
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 405 =200 /index.html;
}

