namespace: clos-de-la-reine-dev
hostname: closdev.zenixweb.fr

sealedSecret:
  enabled: true

sealedSecretDev:
  encryptedData:
    admin-email: 
    jwt-invoice-private-key: 
    jwt-private-key: 
    jwt-public-key: 
    jwt-secret: 
    mongodb-db: 
    mongodb-host: 
    mongodb-password: 
    mongodb-uri: 
    mongodb-user: 
    stripe-publishable-key: 
    stripe-secret-key: 
imagePullSecrets:
  - name: ghcr-secret

backend:
  image: ghcr.io/emmguardia/clos-de-la-reine-back@sha256:7e48ed835c23c24541c0358264f62032d6b1eb7a20768e2eabc3aca2b3a67f2e
  imagePullPolicy: Always
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1  # Garder Ã  1 pour permettre le scale 0â†’1 si besoin
      maxSurge: 1
  port: 3000
  env:
    PORT: "3000"
    NODE_ENV: development
    FRONTEND_URL: ""  # Vide = CORS '*' et fallback closdelareine.fr pour les emails
    JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private_key.pem
    EMAIL_SERVICE_URL: http://email-service.email-service.svc.cluster.local:8080
  secretName: clos-secrets
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"  # Prod=768Mi â€” Node.js+Stripe+bcrypt nÃ©cessite au minimum ~400Mi
  hpa:
    enabled: false  # Pas d'HPA en dev (replicas gÃ©rÃ©s Ã  la main)

frontend:
  image: ghcr.io/emmguardia/clos-de-la-reine-front@sha256:f15998dff714a4735fbdeef552d48a1530a906a94b168d12dc3c6bae565417b3
  imagePullPolicy: Always
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1  # Garder Ã  1 pour permettre le scale 0â†’1 si besoin
      maxSurge: 1
  serviceType: NodePort
  port: 80
  # Le front parle au back via le ConfigMap nginx (mÃªme namespace = clos-de-la-reine-dev)
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  hpa:
    enabled: false  # Pas d'HPA en dev
